name: rambu_shogi
description: "乱舞将棋 - HP制と飛び道具を持つ観戦映え特化の将棋バリアント"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  hooks_riverpod: ^2.4.0

  # Firebase
  firebase_core: ^24.0.0
  cloud_firestore: ^4.13.0
  firebase_auth: ^4.10.0
  firebase_analytics: ^10.7.0
  firebase_messaging: ^14.6.0
  firebase_storage: ^11.2.0
  firebase_remote_config: ^4.3.0
  firebase_crashlytics: ^3.3.0
  firebase_dynamic_links: ^5.0.0

  # Game Engine
  flame: ^1.10.0
  flame_audio: ^2.1.0

  # UI & Animation
  lottie: ^2.4.0
  go_router: ^12.0.0
  flutter_hooks: ^0.20.0

  # Monetization
  purchases_flutter: ^7.2.0  # RevenueCat

  # HTTP & API
  dio: ^5.3.0
  http: ^1.1.0

  # Storage & Serialization
  shared_preferences: ^2.2.0
  json_serializable: ^6.7.0
  json_annotation: ^4.8.0

  # Logging & Debugging
  logger: ^2.0.0
  talker_flutter: ^2.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  freezed_annotation: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.0
  mockito: ^5.4.0
  test: ^1.24.0
